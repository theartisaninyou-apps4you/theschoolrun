{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Verify your email</h1>
  <p class="muted">Enter the email address you used to create your The School Run account. We'll send a fresh verification link if the account still needs verification.</p>
  <form method="post">
    <label>Email</label>
    <input name="email" type="email" required autocomplete="email">
    <button type="submit">Send verification email</button>
  </form>
  <p class="small-note"><a href="{{ url_for('login') }}">Back to log in</a></p>
</div>
{% endblock %}
