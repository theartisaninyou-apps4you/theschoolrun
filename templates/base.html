<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#155e75">
    <title>{% block title %}The School Run{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: Arial, sans-serif; width:100%; max-width:1100px; margin:0 auto; padding:16px; background:#f5f7fb; color:#172033; line-height:1.45; }
        nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px 0 18px; position:sticky; top:0; z-index:20; background:#f5f7fb; }
        nav a { color:#155e75; text-decoration:none; font-weight:600; padding:10px 12px; border-radius:10px; min-height:44px; display:inline-flex; align-items:center; }
        nav a:hover { background:#e8eef3; }
        h1,h2,h3,h4 { line-height:1.2; }
        h1 { font-size:clamp(1.6rem, 5vw, 2.2rem); }
        h2 { font-size:clamp(1.25rem, 4vw, 1.6rem); }
        .card { background:white; border-radius:16px; padding:20px; margin-bottom:18px; box-shadow:0 2px 12px rgba(0,0,0,.06); overflow-wrap:anywhere; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
        .quick { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
        .quick a, button, .button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:11px 14px; border:0; border-radius:9px; background:#155e75; color:white; text-decoration:none; cursor:pointer; font-weight:600; touch-action:manipulation; }
        .quick > a { min-height:40px; padding:8px 12px; font-size:14px; width:auto; }
        .quick-join-form button { min-height:40px; padding:8px 12px; font-size:14px; }
        .secondary { background:#e8eef3; color:#173042; }
        input, select, textarea { width:100%; box-sizing:border-box; padding:12px; margin:5px 0 12px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; font-size:16px; background:white; }
        input[type="checkbox"], input[type="radio"] { width:auto; min-width:20px; min-height:20px; margin:0; }
        label { font-weight:600; display:block; }
        .muted { color:#64748b; }
        .flash { background:#ecfdf5; border:1px solid #86efac; padding:12px; border-radius:9px; margin-bottom:15px; }
        .badge { display:inline-block; padding:4px 8px; border-radius:999px; background:#e0f2fe; font-size:12px; }
        .lift-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px; }
        .lift-card { border:1px solid #dbe3ea; border-radius:14px; padding:16px; }
        .lift-time { font-size:18px; font-weight:700; }
        .join-button { width:100%; margin-top:8px; }
        .calendar-card { overflow:visible; }
        .calendar-summary { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 12px; margin:10px 0 12px; border:1px solid #dbe3ea; border-radius:10px; background:#f8fafc; font-size:13px; }
        .calendar { overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; }
        .week { min-width:900px; display:grid; grid-template-columns:repeat(7,minmax(125px,1fr)); gap:8px; align-items:start; }
        .day { background:#f8fafc; border:1px solid #dbe3ea; border-radius:12px; min-height:220px; padding:8px; height:auto; }
        .day-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:2px 2px 9px; padding-bottom:7px; border-bottom:1px solid #e2e8f0; }
        .day-header strong { display:block; font-size:15px; }
        .day-header small { display:block; color:#64748b; font-size:12px; margin-top:1px; }
        .day-count { min-width:24px; height:24px; padding:0 7px; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; background:#dff2f8; color:#155e75; font-size:11px; font-weight:700; }
        .day-runs { display:flex; flex-direction:column; gap:6px; }
        .calendar-journey { border:1px solid #d5dee7; border-left:4px solid #155e75; border-radius:9px; padding:6px 7px; background:white; font-size:11px; line-height:1.25; overflow-wrap:anywhere; box-shadow:0 1px 3px rgba(0,0,0,.03); }
        .calendar-slot-head { display:flex; align-items:baseline; gap:5px; margin-bottom:3px; }
        .calendar-time { font-weight:800; font-size:13px; color:#172033; }
        .calendar-duration { color:#94a3b8; font-size:10px; }
        .calendar-driver-line { display:flex; gap:4px; align-items:baseline; flex-wrap:wrap; }
        .passenger-names { color:#334155; }
        .passenger-empty { color:#94a3b8; font-style:italic; }
        .calendar-pickup { color:#64748b; margin-top:2px; font-size:10px; }
        .calendar-slot-link { color:inherit; text-decoration:none; display:flex; flex:1; align-items:baseline; gap:5px; }
        .calendar-slot-link:hover { text-decoration:underline; }
        .calendar-driver-link { color:#155e75; text-decoration:none; display:flex; gap:5px; align-items:baseline; flex-wrap:wrap; min-width:0; }
        .calendar-driver-link:hover { text-decoration:underline; }
        .calendar-driver-link .passenger-names { color:#334155; }
        .calendar-journey-link, .journey-row-link { color:inherit; text-decoration:none; }
        .calendar-journey-link:hover { border-color:#8fb8c8; box-shadow:0 2px 7px rgba(0,0,0,.06); }
        .calendar-open { margin-left:auto; color:#155e75; font-size:9px; font-weight:700; white-space:nowrap; }
        .status-confirmed { background:#dcfce7; color:#166534; }
        .status-offered { background:#f1f5f9; color:#475569; }
        .edit-lift-box .danger { margin-top:8px; }
        .journey-row-link { cursor:pointer; }
        .journey-row-link:hover { border-color:#8fb8c8; background:#f1f8fa; }
        .calendar-driver-line { min-width:0; }
        .passenger-names { overflow-wrap:anywhere; }
        .day-empty { color:#94a3b8; font-size:12px; padding:5px 2px; }

        .legend { display:flex; gap:16px; flex-wrap:wrap; margin:12px 0; font-size:13px; }
        .legend-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }
        .legend-dot.offered { background:#155e75; }
        .legend-dot.booked { background:#b45309; }
        .small-button { padding:5px 8px; font-size:11px; margin-top:6px; min-height:36px; }
        .week-title { text-align:center; flex:1; }
        .slot strong { display:block; }
        .children { display:flex; gap:8px; flex-wrap:wrap; }
        .child-pill { background:#f1f5f9; padding:10px 12px; border-radius:999px; min-height:44px; display:inline-flex; align-items:center; }
        .child-link { color:#155e75; text-decoration:none; }
        .child-link small { font-size:11px; font-weight:400; }
        .view-toggle { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
        .lift-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .tab-button { display:flex; align-items:center; justify-content:center; min-height:46px; padding:10px 8px; border:1px solid #cbd5e1; border-radius:10px; background:#f8fafc; color:#173042; text-decoration:none; font-weight:700; text-align:center; }
        .tab-button.active { background:#155e75; color:white; border-color:#155e75; }
        .lift-list { display:grid; gap:8px; }
        .calendar-list { display:grid; gap:7px; }
        .journey-row { display:grid; grid-template-columns:125px 1fr; gap:12px; align-items:center; border:1px solid #dbe3ea; border-radius:11px; padding:9px 11px; background:#f8fafc; transition:box-shadow .15s ease, border-color .15s ease; }
        .journey-row:hover { border-color:#b8c9d5; box-shadow:0 2px 8px rgba(0,0,0,.05); }
        .journey-date { display:flex; flex-direction:column; white-space:nowrap; }
        .journey-date strong { font-size:13px; }
        .journey-date span { font-size:12px; color:#64748b; }
        .journey-details { min-width:0; }
        .journey-main-line { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
        .journey-driver-count { font-size:10px; padding:3px 7px; border-radius:999px; background:#dff2f8; color:#155e75; font-weight:700; }
        .journey-people { display:flex; flex-wrap:wrap; gap:3px 7px; align-items:center; margin-top:2px; }
        .driver-line { white-space:normal; }
        .journey-separator { color:#94a3b8; }
        .journey-pickup { display:block; color:#64748b; font-size:11px; margin-top:2px; }
        .empty-calendar { display:flex; flex-direction:column; gap:3px; padding:18px; border:1px dashed #cbd5e1; border-radius:11px; text-align:center; background:#f8fafc; }
        .journey-summary { border:1px solid #dbe3ea; border-radius:12px; padding:10px 12px; background:#f8fafc; }
        .journey-summary.journey-definite { border-left:4px solid #155e75; }
        .journey-summary.journey-flexible { border-left:4px solid #64748b; }
        .upcoming-liftshares-hidden { display:none; }
        .child-choice { display:flex; align-items:center; gap:8px; padding:10px; background:#f8fafc; border-radius:9px; margin:5px 0; min-height:44px; }
        .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .row > * { flex:1; min-width:120px; }
        .danger { background:#b91c1c; }
        .code-box { font-size:22px; letter-spacing:1.5px; background:#f1f5f9; border:2px dashed #cbd5e1; border-radius:12px; padding:14px; text-align:center; margin:12px 0; overflow-wrap:anywhere; }
        .quick-join-form { background:#f8fafc; border:1px solid #dbe3ea; border-radius:12px; padding:10px; }
        .quick-join-form label { margin-bottom:3px; }
        .inline-code-form { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; }
        .small-note { font-size:12px; margin-bottom:0; }
        .driver-choice-list { display:flex; flex-direction:column; gap:6px; }
        .driver-choice { display:flex; align-items:center; gap:6px; }
        .driver-choice .child-choice { flex:1; margin:0; }
        .info-help { position:relative; }
        .info-help summary { list-style:none; cursor:pointer; color:#155e75; font-weight:700; padding:7px; min-height:36px; }
        .info-help summary::-webkit-details-marker { display:none; }
        .info-help div { position:absolute; z-index:30; right:0; top:38px; width:min(280px, calc(100vw - 32px)); background:white; border:1px solid #cbd5e1; border-radius:10px; padding:10px; box-shadow:0 4px 14px rgba(0,0,0,.12); font-size:12px; font-weight:400; }
        footer { padding:20px 0 10px; text-align:center; font-size:13px; }
        @media (max-width:700px) {
            body { padding:8px; }
            nav { gap:4px; padding:4px 0 12px; overflow-x:auto; flex-wrap:nowrap; }
            nav a { white-space:nowrap; font-size:14px; padding:9px 10px; }
            .card { padding:14px; border-radius:13px; margin-bottom:12px; }
            .quick { flex-direction:column; align-items:stretch; }
            .quick > a { width:auto; align-self:flex-start; }
            .quick-join-form button { width:auto; }
            .row { align-items:stretch; }
            .row > * { min-width:100%; }
            .week-nav { gap:8px; }
            .week-nav .week-title { order:-1; text-align:center; }
            .inline-code-form { grid-template-columns:1fr; }
            .view-toggle { display:grid; grid-template-columns:1fr 1fr; }
            .lift-tabs { grid-template-columns:1fr; }
            .view-toggle .button { width:100%; }
            .children { display:grid; grid-template-columns:1fr; }
            .child-pill { border-radius:10px; width:100%; }
            .lift-grid, .grid { grid-template-columns:1fr; }
            .lift-card { padding:13px; }
            .week { min-width:0; display:block; }
            .day { min-height:0; margin-bottom:9px; }
            .day-runs { gap:7px; }
            .calendar-journey { padding:9px 10px; font-size:13px; }
            .calendar-time { font-size:14px; }
            .calendar-driver-line { display:block; margin-top:4px; }
            .calendar-driver-line > span { display:inline; }
            .calendar-pickup { font-size:11px; }
            .calendar-summary { flex-direction:column; align-items:flex-start; }
            .journey-row { grid-template-columns:1fr; gap:4px; }
            .journey-date { flex-direction:row; gap:8px; align-items:baseline; }
            .code-box { font-size:18px; }
            .info-help div { position:fixed; left:16px; right:16px; top:70px; width:auto; }
        }
        @media (max-width:380px) {
            nav a { font-size:13px; padding:8px; }
            .card { padding:12px; }
            .view-toggle { grid-template-columns:1fr; }
            .week { min-width:0; }
            .calendar-open { font-size:10px; }
        }
    
.calendar-refresh-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 16px;padding:10px 12px;background:#f8fafc;border:1px solid #dbe3ea;border-radius:12px}
.calendar-refresh-button{min-height:40px;padding:8px 14px}.driver-only-note{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#f8fafc;border:1px solid #dbe3ea;border-radius:10px;margin:8px 0 12px}.driver-only-note strong{white-space:nowrap}
@media (max-width:700px){.calendar-refresh-bar{align-items:stretch;flex-direction:column}.calendar-refresh-button{width:100%}.calendar-refresh-bar .small-note{font-size:.82rem}}
</style>
</head>
<body>
<nav>
    <a href="{{ url_for('dashboard') }}">🏠 Dashboard</a>
    {% if session.get('user_id') %}
        <a href="{{ url_for('calendar_view') }}">📅 Calendar</a>
        <a href="{{ url_for('profile') }}">Family</a>
        <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
        <a href="{{ url_for('login') }}">Log in</a><a href="{{ url_for('register') }}">Register</a>
    {% endif %}
</nav>
{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
<footer style="padding:20px 0 10px;text-align:center;font-size:13px"><a href="{{ url_for('terms') }}">Terms & Conditions</a></footer>
</body>
</html>
