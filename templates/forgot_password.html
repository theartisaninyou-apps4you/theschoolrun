{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Reset your password</h1>
  <p class="muted">Enter the email address on your The School Run account and we'll send you a secure password-reset link.</p>
  <form method="post">
    <label>Email</label>
    <input name="email" type="email" autocomplete="email" required>
    <button type="submit">Send reset email</button>
  </form>
  <p class="small-note"><a href="{{ url_for('login') }}">Back to log in</a></p>
</div>
{% endblock %}
